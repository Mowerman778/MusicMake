[project]
name = "musicmake"
version = "0.1.0"
description = "A private, local prompt-to-song music maker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "numpy>=1.26", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.optional-dependencies]
lyrics = ["anthropic>=2.0"]
stems = ["demucs"]
dev = ["pytest"]

[project.scripts]
musicmake = "musicmake.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["musicmake*"]

[tool.setuptools.package-data]
musicmake = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
