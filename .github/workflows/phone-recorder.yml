name: Phone recorder APK

on:
  push:
    paths:
      - "phone-recorder/**"
      - ".github/workflows/phone-recorder.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: musicmake-recorder-apk
          path: phone-recorder/app/build/outputs/apk/release/app-release.apk
