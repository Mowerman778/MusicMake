name: Phone recorder APK

on:
  push:
    paths:
      - "phone-recorder/**"
      - ".github/workflows/phone-recorder.yml"
  workflow_dispatch:

permissions:
  contents: write  # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-recorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: musicmake-recorder-apk
          path: phone-recorder/app/build/outputs/apk/release/app-release.apk
      - name: Publish APK as the "recorder-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk MusicMake-Recorder.apk
          gh release view recorder-latest >/dev/null 2>&1 || gh release create recorder-latest \
            --target "$GITHUB_SHA" --title "MusicMake Recorder (latest build)" \
            --notes "Android app that records phone audio to MP3. Download MusicMake-Recorder.apk on your phone and open it to install (Android 10 or newer)."
          gh release upload recorder-latest MusicMake-Recorder.apk --clobber
